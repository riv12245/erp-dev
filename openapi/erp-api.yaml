paths:
  /health:
    get:
      operationId: checkHealth
      tags:
        - Health
      summary: Health check
      description: Basic health check endpoint. Returns the overall status of the API server.
      security: []
      responses:
        '200':
          description: Process/connection status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '429':
          description: Global HTTP rate limiter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-implementation-status: implemented
  /health/ready:
    get:
      operationId: checkReadiness
      tags:
        - Health
      summary: Readiness check
      description: Returns whether the service is ready to accept traffic. Checks all critical dependencies.
      security: []
      responses:
        '200':
          description: Process/connection status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '429':
          description: Global HTTP rate limiter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: MongoDB not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
      x-implementation-status: implemented
  /health/live:
    get:
      operationId: checkLiveness
      tags:
        - Health
      summary: Liveness check
      description: Returns whether the service process is alive. Used by container orchestrators.
      security: []
      responses:
        '200':
          description: Process/connection status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '429':
          description: Global HTTP rate limiter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-implementation-status: implemented
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
        - Authentication
      summary: User login
      description: >-
        Validate credentials and active user, selected active tenant and active membership. Roles come from that
        membership. Creates a persistent session with absolute refresh expiry and a bounded rotation count.
        Native receives an opaque refresh token; web receives HttpOnly cookie only. No implicit tenant assignment.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing tenant context, absent/invalid/expired token, or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Tenant or membership denied, token/context mismatch or insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Global HTTP rate limiter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/SessionClient'
  /api/v1/auth/register:
    post:
      operationId: register
      tags:
        - Authentication
      summary: User registration
      description: >-
        Creates a global user identity without a tenant, membership, roles or token. Separate onboarding must grant
        membership before tenant login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User created
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - correlationId
                properties:
                  data:
                    type: object
