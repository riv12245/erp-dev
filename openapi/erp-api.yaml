openapi: 3.1.0
info:
  title: ERP Platform API
  description: >-
    Modular monolith ERP. Operations marked x-implementation-status: roadmap are contracts only and are NOT implemented.
    Public routes: health, status, register and login. Login requires x-tenant-id. Protected routes require JWT plus
    matching tenant context and an active membership. No default tenant. Responses use data/meta/correlationId or
    error/correlationId, without a success flag. Company/branch headers are contextual metadata, not independently
    authorized scopes.
  version: v1
  contact:
    name: ERP Platform Team
    email: dev@erp.local
    url: https://erp.local
  license:
    name: Proprietary
    url: https://erp.local/license
servers:
  - url: http://localhost:3000
    description: Local development; paths include /api/v1 where applicable
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        HS256 access JWT with sub, tenantId, roles, iat and exp. Effective permissions and identity are resolved from
        IAM on every request. Refresh/logout are roadmap.
  schemas:
    Error:
      type: object
      required:
        - error
        - correlationId
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        correlationId:
          type: string
      example:
        error:
          code: FORBIDDEN
          message: Forbidden
        correlationId: example-request-id
    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - INTERNAL_SERVER_ERROR
            - BAD_REQUEST
            - TENANT_ACCESS_DENIED
            - INSUFFICIENT_STOCK
            - UNAUTHORIZED_TRANSITION
            - FISCAL_PERIOD_CLOSED
            - DUPLICATE_RESOURCE
            - RESOURCE_NOT_FOUND
            - VALIDATION_SCHEMA_ERROR
            - IDEMPOTENCY_KEY_EXISTS
            - RATE_LIMIT_EXCEEDED
            - EXTERNAL_SERVICE_ERROR
            - TIMEOUT_ERROR
            - FEATURE_DISABLED
            - PERMISSION_DENIED
            - TENANT_CONTEXT_MISSING
            - INTERNAL_ERROR
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid
    SuccessResponse:
      type: object
      required:
        - data
        - correlationId
      properties:
        data:
          type: object
          description: The response payload
          additionalProperties: true
        meta:
          type: object
          description: Optional metadata about the response
          additionalProperties: true
        correlationId:
          type: string
          format: uuid
          description: Unique identifier for tracing the request
    PaginatedResponse:
      type: object
      required:
        - data
        - meta
        - correlationId
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        correlationId:
          type: string
          format: uuid
    PaginationMeta:
      type: object
      required:
        - total
        - page
        - limit
        - totalPages
        - hasNextPage
        - hasPrevPage
      properties:
        total:
          type: integer
          description: Total number of records
        page:
          type: integer
          description: Current page number
        limit:
          type: integer
          description: Number of records per page
        totalPages:
          type: integer
          description: Total number of pages
        hasNextPage:
          type: boolean
        hasPrevPage:
          type: boolean
    User:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - tenantId
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique user identifier
        email:
          type: string
          format: email
          description: User email address
        firstName:
          type: string
          description: User's first name
        lastName:
          type: string
          description: User's last name
        tenantId:
          type: string
          format: uuid
          description: The tenant this user belongs to
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          description: Roles assigned to the user
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          description: Permissions granted to the user
        isActive:
          type: boolean
          description: Whether the user account is active
        lastLoginAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      required:
        - email
        - firstName
        - lastName
        - password
        - tenantId
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 8
          description: Must contain uppercase, lowercase, number, and special character
        tenantId:
          type: string
          format: uuid
        roleIds:
          type: array
          items:
            type: string
            format: uuid
          description: Array of role IDs to assign to the user
    UpdateUserRequest:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        isActive:
          type: boolean
        roleIds:
          type: array
          items:
            type: string
            format: uuid
    Tenant:
      type: object
      required:
        - id
        - name
        - slug
        - domain
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Legal name of the tenant organization
        slug:
          type: string
          description: URL-friendly identifier for the tenant
        domain:
          type: string
          format: uri
          description: Primary domain for the tenant
        logoUrl:
          type: string
          format: uri
        subscription:
          type: object
          properties:
            plan:
              type: string
              enum:
                - FREE
                - PRO
                - ENTERPRISE
                - CUSTOM
            status:
              type: string
              enum:
                - ACTIVE
                - PAST_DUE
                - CANCELLED
                - SUSPENDED
            currentPeriodEnd:
              type: string
              format: date-time
            stripeSubscriptionId:
              type: string
          description: Subscription details for the tenant
        settings:
          type: object
          additionalProperties: true
          description: Tenant-specific configuration settings
        isActive:
          type: boolean
          description: Whether the tenant is active
        maxUsers:
          type: integer
          description: Maximum number of users allowed
        currentUsers:
          type: integer
          description: Current number of active users
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateTenantRequest:
      type: object
      required:
        - name
        - slug
        - domain
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 64
        domain:
          type: string
          format: uri
        plan:
          type: string
          enum:
            - FREE
            - PRO
            - ENTERPRISE
            - CUSTOM
          default: FREE
        settings:
          type: object
          additionalProperties: true
    UpdateTenantRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        domain:
          type: string
          format: uri
        logoUrl:
          type: string
          format: uri
        isActive:
          type: boolean
        settings:
          type: object
          additionalProperties: true
    Role:
      type: object
      required:
        - id
        - name
        - tenantId
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Display name of the role
        description:
          type: string
        tenantId:
          type: string
          format: uuid
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        isActive:
          type: boolean
        isSystem:
          type: boolean
          description: Whether this is a built-in system role
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateRoleRequest:
      type: object
      required:
        - name
        - tenantId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        tenantId:
          type: string
          format: uuid
        permissionIds:
          type: array
          items:
            type: string
            format: uuid
    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        permissionIds:
          type: array
          items:
            type: string
            format: uuid
        isActive:
          type: boolean
    Permission:
      type: object
      required:
        - id
        - name
        - resource
        - action
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Human-readable permission name
        resource:
          type: string
          description: The resource this permission applies to (e.g., "users", "tenants")
        action:
          type: string
          description: The action allowed (e.g., "read", "write", "delete", "admin")
        conditions:
          type: object
          additionalProperties: true
          description: Optional conditions for when this permission applies
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreatePermissionRequest:
      type: object
      required:
        - name
        - resource
        - action
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        resource:
          type: string
        action:
          type: string
        conditions:
          type: object
          additionalProperties: true
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required:
        - data
        - correlationId
      properties:
        data:
          type: object
          required:
            - accessToken
            - user
          properties:
            accessToken:
              type: string
              description: Bearer token; never log it
            user:
              type: object
              required:
                - userId
                - email
              properties:
                userId:
                  type: string
                email:
                  type: string
                  format: email
        correlationId:
          type: string
          format: uuid
        meta:
          type: object
          properties:
            action:
              const: login
    RegisterRequest:
      type: object
      required:
        - email
        - firstName
        - lastName
        - password
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        password:
          type: string
          format: password
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Valid refresh token
    RefreshTokenResponse:
      type: object
      required:
        - success
        - data
        - correlationId
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            expiresIn:
              type: integer
        correlationId:
          type: string
          format: uuid
    LogoutRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    LogoutResponse:
      type: object
      required:
        - success
        - correlationId
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          additionalProperties: true
        correlationId:
          type: string
          format: uuid
    Company:
      type: object
      required:
        - id
        - name
        - tenantId
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Legal name of the company
        slug:
          type: string
        taxId:
          type: string
          description: Tax identification number
        currency:
          type: string
          description: Default currency code (ISO 4217)
        locale:
          type: string
          description: Default locale (e.g., "en-US")
        timezone:
          type: string
          description: Default timezone
        address:
          type: object
          properties:
            street:
              type: string
            city:
              type: string
            state:
              type: string
            country:
              type: string
            postalCode:
              type: string
        phone:
          type: string
        logoUrl:
          type: string
          format: uri
        tenantId:
          type: string
          format: uuid
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateCompanyRequest:
      type: object
      required:
        - name
        - tenantId
      properties:
        name:
          type: string
        slug:
          type: string
        taxId:
          type: string
        currency:
          type: string
        locale:
          type: string
        timezone:
          type: string
        address:
          type: object
          additionalProperties: true
        phone:
          type: string
    UpdateCompanyRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        taxId:
          type: string
        currency:
          type: string
        locale:
          type: string
        timezone:
          type: string
        address:
          type: object
          additionalProperties: true
        phone:
          type: string
        isActive:
          type: boolean
    AuditEntry:
      type: object
      required:
        - auditId
        - tenantId
        - action
        - entityType
        - timestamp
      properties:
        _id:
          type: string
        auditId:
          type: string
        tenantId:
          type: string
        actorId:
          type: string
        companyId:
          type: string
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        ip:
          type: string
        userAgent:
          type: string
        correlationId:
          type: string
        requestId:
          type: string
        before: {}
        after: {}
        timestamp:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AuditFilter:
      type: object
      properties:
        entityType:
          type: string
        action:
          type: string
        actorId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        fromDate:
          type: string
          format: date-time
        toDate:
          type: string
          format: date-time
        page:
          type: integer
          default: 1
        limit:
          type: integer
          default: 20
    HealthStatus:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          properties:
            api:
              type: string
              enum:
                - up
            mongodb:
              type: string
              enum:
                - up
                - down
    HealthDetailed:
      $ref: '#/components/schemas/HealthStatus'
    ValidationError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: The field that failed validation
        message:
          type: string
          description: Human-readable validation error message
        value:
          description: The invalid value
          nullable: true
    StandardSuccess:
      type: object
      required:
        - success
        - data
        - correlationId
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          additionalProperties: true
        correlationId:
          type: string
          format: uuid
    StandardSuccessWithMeta:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - success
            - data
            - meta
            - correlationId
          properties:
            meta:
              $ref: '#/components/schemas/PaginationMeta'
    IdempotencyKey:
      type: object
      properties:
        key:
          type: string
          description: The idempotency key
        expiresAt:
          type: string
          format: date-time
    Country:
      type: object
      required:
        - id
        - code
        - name
        - isActive
      properties:
        id:
          type: string
          description: Country identifier (Mongo ObjectId)
        code:
          type: string
          description: ISO 3166-1 alpha-2 or alpha-3 code, uppercased
        name:
          type: string
          description: Country name
        isActive:
          type: boolean
          description: Whether the country is available for selection
    CountryCreateRequest:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 3
          description: ISO 3166-1 code
        name:
          type: string
          minLength: 1
          maxLength: 150
        isActive:
          type: boolean
          default: true
  responses:
    Success:
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    SuccessWithMeta:
      description: Successful paginated operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaginatedResponse'
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    TenantIdPathParam:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
      description: The tenant ID
    CompanyIdPathParam:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The company ID
    UserIdPathParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The user ID
    RoleIdPathParam:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The role ID
    PermissionIdPathParam:
      name: permissionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The permission ID
    TenantIdHeader:
      name: x-tenant-id
      in: header
      required: true
      schema:
        type: string
      description: >-
        Explicit tenant selector. Must equal the JWT tenant on protected routes; missing returns 401
        TENANT_CONTEXT_MISSING, mismatch returns 403.
    Paginationpage:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
        description: Page number
    Paginationlimit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
        description: Number of items per page
    PaginationsortBy:
      name: sortBy
      in: query
      schema:
        type: string
        description: Field to sort by
    PaginationsortOrder:
      name: sortOrder
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
        description: Sort order
  requestBodies:
    LoginRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginRequest'
    RegisterRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegisterRequest'
    RefreshTokenRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefreshTokenRequest'
    LogoutRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LogoutRequest'
    CreateTenantRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateTenantRequest'
    UpdateTenantRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateTenantRequest'
    CreateCompanyRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateCompanyRequest'
    UpdateCompanyRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateCompanyRequest'
    CreateUserRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateUserRequest'
    UpdateUserRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateUserRequest'
    CreateRoleRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateRoleRequest'
    UpdateRoleRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateRoleRequest'
    CreatePermissionRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreatePermissionRequest'
    AuditFilter:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuditFilter'
paths:
  /health:
    get:
      operationId: checkHealth
      tags:
        - Health
      summary: Health check
      description: Basic health check endpoint. Returns the overall status of the API server.
      security: []
      responses:
        '200':
          description: Process/connection status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '429':
          description: Global HTTP rate limiter
          content:
            text/plain:
              schema:
                type: string
      x-implementation-status: implemented
  /health/ready:
    get:
      operationId: checkReadiness
      tags:
        - Health
      summary: Readiness check
      description: Returns whether the service is ready to accept traffic. Checks all critical dependencies.
      security: []
      responses:
        '200':
          description: Process/connection status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '429':
          description: Global HTTP rate limiter
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: MongoDB not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
      x-implementation-status: implemented
  /health/live:
    get:
      operationId: checkLiveness
      tags:
        - Health
      summary: Liveness check
      description: Returns whether the service process is alive. Used by container orchestrators.
      security: []
      responses:
        '200':
          description: Process/connection status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '429':
          description: Global HTTP rate limiter
          content:
            text/plain:
              schema:
                type: string
      x-implementation-status: implemented
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
        - Authentication
      summary: User login
      description: >-
        Validate credentials and active user, selected active tenant and active membership. Roles come from that
        membership. Returns only an access token; no implicit tenant assignment.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
