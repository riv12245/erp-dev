openapi: 3.1.0
info:
  title: ERP Platform API
  description: >-
    Modular monolith ERP. Operations marked x-implementation-status: roadmap are contracts only and are NOT implemented.
    Public routes: health, status, register and login. Refresh/logout require a refresh credential. Login requires x-tenant-id. Protected routes require JWT plus
    matching tenant context and an active membership. No default tenant. Responses use data/meta/correlationId or
    error/correlationId, without a success flag. Company/branch headers are contextual metadata, not independently
    authorized scopes. Business company routes also require an active persisted company and explicit company membership.
  version: v1
  contact:
    name: ERP Platform Team
    email: dev@erp.local
    url: https://erp.local
  license:
    name: Proprietary
    url: https://erp.local/license
servers:
  - url: http://localhost:3000
    description: Local development; paths include /api/v1 where applicable
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        HS256 access JWT with sub, sid, tenantId, roles, iat and exp. Session, user and membership are checked in
        MongoDB on every request. Revocation denies subsequent checks immediately; in-flight work is not rolled back.
    refreshCookie:
      type: apiKey
      in: cookie
      name: erp_refresh
      description: HttpOnly SameSite Strict cookie scoped to /api/v1/auth; Secure in production. Web writes require an exact trusted Origin and x-session-client web.
  schemas:
    Error:
      type: object
      required:
        - error
        - correlationId
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        correlationId:
          type: string
      example:
        error:
          code: FORBIDDEN
          message: Forbidden
        correlationId: example-request-id
    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - INTERNAL_SERVER_ERROR
            - BAD_REQUEST
            - TENANT_ACCESS_DENIED
            - INSUFFICIENT_STOCK
            - INVENTORY_INSUFFICIENT_STOCK
            - UNAUTHORIZED_TRANSITION
            - FISCAL_PERIOD_CLOSED
            - DUPLICATE_RESOURCE
            - RESOURCE_NOT_FOUND
            - VALIDATION_SCHEMA_ERROR
            - IDEMPOTENCY_KEY_EXISTS
            - RATE_LIMIT_EXCEEDED
            - EXTERNAL_SERVICE_ERROR
            - TIMEOUT_ERROR
            - FEATURE_DISABLED
            - PERMISSION_DENIED
            - TENANT_CONTEXT_MISSING
            - INTERNAL_ERROR
            - RATE_LIMITED
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid
    SuccessResponse:
      type: object
      required:
        - data
        - correlationId
      properties:
        data:
          type: object
          description: The response payload
          additionalProperties: true
        meta:
          type: object
          description: Optional metadata about the response
          additionalProperties: true
        correlationId:
          type: string
          format: uuid
          description: Unique identifier for tracing the request
    PaginatedResponse:
      type: object
      required:
        - data
        - meta
        - correlationId
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        correlationId:
          type: string
          format: uuid
    PaginationMeta:
      type: object
      required:
        - total
        - page
        - limit
        - totalPages
        - hasNextPage
        - hasPrevPage
      properties:
        total:
          type: integer
          description: Total number of records
        page:
          type: integer
          description: Current page number
        limit:
          type: integer
          description: Number of records per page
        totalPages:
          type: integer
          description: Total number of pages
        hasNextPage:
          type: boolean
        hasPrevPage:
          type: boolean
    User:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - tenantId
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique user identifier
        email:
          type: string
          format: email
          description: User email address
        firstName:
          type: string
          description: User's first name
        lastName:
          type: string
          description: User's last name
        tenantId:
          type: string
          format: uuid
          description: The tenant this user belongs to
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          description: Roles assigned to the user
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          description: Permissions granted to the user
        isActive:
          type: boolean
          description: Whether the user account is active
        lastLoginAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      required:
        - email
        - firstName
        - lastName
        - password
        - tenantId
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 8
          description: Must contain uppercase, lowercase, number, and special character
        tenantId:
          type: string
          format: uuid
        roleIds:
          type: array
          items:
            type: string
            format: uuid
          description: Array of role IDs to assign to the user
    UpdateUserRequest:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        isActive:
          type: boolean
        roleIds:
          type: array
          items:
            type: string
            format: uuid
    Tenant:
      type: object
      required:
        - id
        - name
        - slug
        - domain
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Legal name of the tenant organization
        slug:
          type: string
          description: URL-friendly identifier for the tenant
        domain:
          type: string
          format: uri
          description: Primary domain for the tenant
        logoUrl:
          type: string
          format: uri
        subscription:
          type: object
          properties:
            plan:
              type: string
              enum:
                - FREE
                - PRO
                - ENTERPRISE
                - CUSTOM
            status:
              type: string
              enum:
                - ACTIVE
                - PAST_DUE
                - CANCELLED
                - SUSPENDED
            currentPeriodEnd:
              type: string
              format: date-time
            stripeSubscriptionId:
              type: string
          description: Subscription details for the tenant
        settings:
          type: object
          additionalProperties: true
          description: Tenant-specific configuration settings
        isActive:
          type: boolean
          description: Whether the tenant is active
        maxUsers:
          type: integer
          description: Maximum number of users allowed
        currentUsers:
          type: integer
          description: Current number of active users
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateTenantRequest:
      type: object
      required:
        - name
        - slug
        - domain
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 64
        domain:
          type: string
          format: uri
        plan:
          type: string
          enum:
            - FREE
            - PRO
            - ENTERPRISE
            - CUSTOM
          default: FREE
        settings:
          type: object
          additionalProperties: true
    UpdateTenantRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        domain:
          type: string
          format: uri
        logoUrl:
          type: string
          format: uri
        isActive:
          type: boolean
        settings:
          type: object
          additionalProperties: true
    Role:
      type: object
      required:
        - id
        - name
        - tenantId
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Display name of the role
        description:
          type: string
        tenantId:
          type: string
          format: uuid
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        isActive:
          type: boolean
        isSystem:
          type: boolean
          description: Whether this is a built-in system role
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateRoleRequest:
      type: object
      required:
        - name
        - tenantId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        tenantId:
          type: string
          format: uuid
        permissionIds:
          type: array
          items:
            type: string
            format: uuid
    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        permissionIds:
          type: array
          items:
            type: string
            format: uuid
        isActive:
          type: boolean
    Permission:
      type: object
      required:
        - id
        - name
        - resource
        - action
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Human-readable permission name
        resource:
          type: string
          description: The resource this permission applies to (e.g., "users", "tenants")
        action:
          type: string
          description: The action allowed (e.g., "read", "write", "delete", "admin")
        conditions:
          type: object
          additionalProperties: true
          description: Optional conditions for when this permission applies
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreatePermissionRequest:
      type: object
      required:
        - name
        - resource
        - action
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        resource:
          type: string
        action:
          type: string
        conditions:
          type: object
          additionalProperties: true
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required:
        - data
        - correlationId
      properties:
        data:
          type: object
          required:
            - accessToken
            - user
            - sessionId
            - tenantId
            - expiresIn
          properties:
            accessToken:
              type: string
              description: Bearer token; never log it
            refreshToken:
              type: string
              description: Opaque rotating credential, native transport only; never log it. Web receives an HttpOnly cookie instead.
            sessionId:
              type: string
              format: uuid
            tenantId:
              type: string
            expiresIn:
              type: integer
              description: Access token lifetime in seconds
            user:
              type: object
              required:
                - userId
                - email
              properties:
                userId:
                  type: string
                email:
                  type: string
                  format: email
        correlationId:
          type: string
          format: uuid
        meta:
          type: object
          properties:
            action:
              const: login
    RegisterRequest:
      type: object
      required:
        - email
        - firstName
        - lastName
        - password
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        password:
          type: string
          format: password
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Valid refresh token
    RefreshTokenResponse:
      $ref: '#/components/schemas/LoginResponse'
    LogoutRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    LogoutResponse:
      type: object
      required:
        - data
        - correlationId
      properties:
        data:
          type: object
          required: [revoked]
          properties:
            revoked:
              const: true
        correlationId:
          type: string
          format: uuid
    Company:
      type: "object"
      additionalProperties: false
      required: ["id","tenantId","name","taxId","registrationNumber","defaultCurrency","defaultTimezone","isActive","version","createdAt","updatedAt"]
      properties:
        name:
          type: "string"
          maxLength: 200
          minLength: 1
        taxId:
          type: "string"
          maxLength: 200
          minLength: 1
        registrationNumber:
          type: "string"
          maxLength: 200
          minLength: 1
        defaultCurrency:
          type: "string"
          pattern: "^[A-Z]{3}$"
        defaultTimezone:
          type: "string"
          maxLength: 200
          description: "Valid IANA timezone"
        id:
          type: "string"
          format: "uuid"
        tenantId:
          type: "string"
          maxLength: 200
        isActive:
          type: "boolean"
        version:
          type: "integer"
          minimum: 0
          maximum: 9007199254740990
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
    CreateCompanyRequest:
      type: "object"
      additionalProperties: false
      required: ["name","taxId","registrationNumber","defaultCurrency","defaultTimezone"]
      properties:
        name:
          type: "string"
          maxLength: 200
          minLength: 1
        taxId:
          type: "string"
          maxLength: 200
          minLength: 1
        registrationNumber:
          type: "string"
          maxLength: 200
          minLength: 1
        defaultCurrency:
          type: "string"
          pattern: "^[A-Z]{3}$"
        defaultTimezone:
          type: "string"
          maxLength: 200
          description: "Valid IANA timezone"
    CustomerCreate:
      type: "object"
      additionalProperties: false
      required: ["type","name"]
      properties:
        type:
          type: "string"
          enum: ["company","individual"]
        name:
          type: "string"
          maxLength: 200
          minLength: 1
        email:
          type: "string"
          maxLength: 254
          format: "email"
        phone:
          type: "string"
          maxLength: 50
        taxId:
          type: "string"
          maxLength: 100
    CustomerPatch:
      type: "object"
      additionalProperties: false
      required: ["expectedVersion"]
      properties:
        type:
          type: "string"
          enum: ["company","individual"]
        name:
          type: "string"
          maxLength: 200
          minLength: 1
        email:
          type: "string"
          maxLength: 254
          format: "email"
        phone:
          type: "string"
          maxLength: 50
        taxId:
          type: "string"
          maxLength: 100
        status:
          type: "string"
          enum: ["active","inactive","blocked"]
        expectedVersion:
          type: "integer"
          minimum: 1
          maximum: 9007199254740990
    Customer:
      type: "object"
      additionalProperties: false
      required: ["customerId","tenantId","companyId","name","type","status","version","createdAt","updatedAt"]
      properties:
        type:
          type: "string"
          enum: ["company","individual"]
        name:
          type: "string"
          maxLength: 200
          minLength: 1
        email:
          type: "string"
          maxLength: 254
          format: "email"
        phone:
          type: "string"
          maxLength: 50
        taxId:
          type: "string"
          maxLength: 100
        customerId:
          type: "string"
          format: "uuid"
        tenantId:
          type: "string"
          maxLength: 200
        companyId:
          type: "string"
          format: "uuid"
        status:
          type: "string"
          enum: ["active","inactive","blocked"]
        version:
          type: "integer"
          minimum: 1
          maximum: 9007199254740990
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
        createdBy:
          type: "string"
          maxLength: 200
        updatedBy:
          type: "string"
          maxLength: 200
    ProductCreate:
      type: "object"
      additionalProperties: false
      required: ["name","sku","unitOfMeasure"]
      properties:
        name:
          type: "string"
          maxLength: 200
          minLength: 1
        sku:
          type: "string"
          maxLength: 200
          minLength: 1
          description: "Normalized uppercase; unique within tenant and company"
        unitOfMeasure:
          type: "string"
          enum: ["piece","kg","liter","meter","box","set"]
        description:
          type: "string"
          maxLength: 2000
        category:
          type: "string"
          maxLength: 2000
        subcategory:
          type: ["string","null"]
          maxLength: 2000
        costPrice:
          type: "number"
          minimum: 0
        sellingPrice:
          type: "number"
          minimum: 0
        taxRate:
          type: "number"
          minimum: 0
          description: "Reference metadata only; not a fiscal tax calculation"
        weight:
          type: ["number","null"]
          minimum: 0
        dimensions:
          oneOf: [{"type":"null"},{"type":"object","additionalProperties":false,"required":["length","width","height","unit"],"properties":{"length":{"type":"number","minimum":0},"width":{"type":"number","minimum":0},"height":{"type":"number","minimum":0},"unit":{"type":"string","maxLength":20}}}]
        isActive:
          type: "boolean"
    ProductPatch:
      type: "object"
      additionalProperties: false
      required: ["expectedVersion"]
      properties:
        name:
          type: "string"
          maxLength: 200
          minLength: 1
        sku:
          type: "string"
          maxLength: 200
          minLength: 1
          description: "Normalized uppercase; unique within tenant and company"
        unitOfMeasure:
          type: "string"
          enum: ["piece","kg","liter","meter","box","set"]
        description:
          type: "string"
          maxLength: 2000
        category:
          type: "string"
          maxLength: 2000
        subcategory:
          type: ["string","null"]
          maxLength: 2000
        costPrice:
          type: "number"
          minimum: 0
        sellingPrice:
          type: "number"
          minimum: 0
        taxRate:
          type: "number"
          minimum: 0
          description: "Reference metadata only; not a fiscal tax calculation"
        weight:
          type: ["number","null"]
          minimum: 0
        dimensions:
          oneOf: [{"type":"null"},{"type":"object","additionalProperties":false,"required":["length","width","height","unit"],"properties":{"length":{"type":"number","minimum":0},"width":{"type":"number","minimum":0},"height":{"type":"number","minimum":0},"unit":{"type":"string","maxLength":20}}}]
        isActive:
          type: "boolean"
        expectedVersion:
          type: "integer"
          minimum: 0
          maximum: 9007199254740990
    Product:
      type: "object"
      additionalProperties: false
      required: ["id","companyId","name","sku","unitOfMeasure","isActive","version","createdAt","updatedAt"]
      properties:
        name:
          type: "string"
          maxLength: 200
          minLength: 1
        sku:
          type: "string"
          maxLength: 200
          minLength: 1
          description: "Normalized uppercase; unique within tenant and company"
        unitOfMeasure:
          type: "string"
          enum: ["piece","kg","liter","meter","box","set"]
        description:
          type: "string"
          maxLength: 2000
        category:
          type: "string"
          maxLength: 2000
        subcategory:
          type: ["string","null"]
          maxLength: 2000
        costPrice:
          type: "number"
          minimum: 0
        sellingPrice:
          type: "number"
          minimum: 0
        taxRate:
          type: "number"
          minimum: 0
          description: "Reference metadata only; not a fiscal tax calculation"
        weight:
          type: ["number","null"]
          minimum: 0
        dimensions:
          oneOf: [{"type":"null"},{"type":"object","additionalProperties":false,"required":["length","width","height","unit"],"properties":{"length":{"type":"number","minimum":0},"width":{"type":"number","minimum":0},"height":{"type":"number","minimum":0},"unit":{"type":"string","maxLength":20}}}]
        isActive:
          type: "boolean"
        id:
          type: "string"
          format: "uuid"
        companyId:
          type: "string"
          format: "uuid"
        version:
          type: "integer"
          minimum: 0
          maximum: 9007199254740990
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
    WarehouseCreate:
      type: "object"
      additionalProperties: false
      required: ["name","code"]
      properties:
        name:
          type: "string"
          maxLength: 200
          minLength: 1
        code:
          type: "string"
          maxLength: 200
          minLength: 1
          description: "Uppercase; unique within tenant/company"
        location:
          type: "string"
          maxLength: 1000
        type:
          type: "string"
          enum: ["main","regional","local","dropship"]
        capacity:
          type: "number"
          minimum: 0
        isActive:
          type: "boolean"
    WarehousePatch:
      type: "object"
      additionalProperties: false
      required: ["expectedVersion"]
      properties:
        name:
          type: "string"
          maxLength: 200
          minLength: 1
        code:
          type: "string"
          maxLength: 200
          minLength: 1
          description: "Uppercase; unique within tenant/company"
        location:
          type: "string"
          maxLength: 1000
        type:
          type: "string"
          enum: ["main","regional","local","dropship"]
        capacity:
          type: "number"
          minimum: 0
        isActive:
          type: "boolean"
        expectedVersion:
          type: "integer"
          minimum: 0
          maximum: 9007199254740990
    Warehouse:
      type: "object"
      additionalProperties: false
      required: ["id","companyId","name","code","isActive","version","createdAt","updatedAt"]
      properties:
        name:
          type: "string"
          maxLength: 200
          minLength: 1
        code:
          type: "string"
          maxLength: 200
          minLength: 1
          description: "Uppercase; unique within tenant/company"
        location:
          type: "string"
          maxLength: 1000
        type:
          type: "string"
          enum: ["main","regional","local","dropship"]
        capacity:
          type: "number"
          minimum: 0
        isActive:
          type: "boolean"
        id:
          type: "string"
          format: "uuid"
        companyId:
          type: "string"
          format: "uuid"
        version:
          type: "integer"
          minimum: 0
          maximum: 9007199254740990
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
    StockAvailability:
      type: "object"
      additionalProperties: false
      required: ["companyId","productId","warehouseId","onHand","available","reserved","reservationsSupported"]
      properties:
        companyId:
          type: "string"
          format: "uuid"
        productId:
          type: "string"
          format: "uuid"
        warehouseId:
          type: "string"
          format: "uuid"
        onHand:
          type: "number"
          minimum: 0
        available:
          type: "number"
          minimum: 0
        reserved:
          const: 0
        reservationsSupported:
          const: false
    StockMovementCreate:
      type: "object"
      additionalProperties: false
      required: ["productId","warehouseId","type","quantity","reason","idempotencyKey"]
      properties:
        productId:
          type: "string"
          format: "uuid"
        warehouseId:
          type: "string"
          format: "uuid"
        type:
          type: "string"
          enum: ["inbound","outbound","adjustment"]
        quantity:
          type: "number"
          description: "Nonzero signed delta for adjustment; positive for inbound/outbound. At most six decimal places, safe integer micro-units; scaled absolute value and resulting balance must not exceed MAX_SAFE_INTEGER. Floating-point values that cannot preserve a micro-unit are rejected."
        reason:
          type: "string"
          maxLength: 1000
          minLength: 1
        idempotencyKey:
          type: "string"
          maxLength: 200
          minLength: 1
        referenceId:
          type: ["string","null"]
          maxLength: 200
    StockMovement:
      type: "object"
      additionalProperties: false
