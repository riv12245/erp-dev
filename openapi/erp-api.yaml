  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      tags:
        - Authentication
      summary: Rotate a persistent session
      description: >-
        Atomically rotates the refresh credential. Known reuse revokes the session family, including competing refreshes.
        Tenant is recovered from the session; no tenant header is required. Absolute expiry is not extended.
        Native sends JSON refreshToken without Origin. Web sends cookie, trusted Origin and x-session-client web, without JSON credentials.
      security:
        - refreshCookie: []
        - {}
      parameters:
        - $ref: '#/components/parameters/SessionClient'
      requestBody:
        required: false
        description: Required for native transport only
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin, tenant or membership denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-implementation-status: implemented
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
        - Authentication
      summary: Revoke the current session
      description: Idempotently revokes a session using its current or previously rotated credential and clears the browser cookie. Same transport and Origin policy as refresh.
      security:
        - refreshCookie: []
        - {}
      parameters:
        - $ref: '#/components/parameters/SessionClient'
      requestBody:
        required: false
